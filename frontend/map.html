<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FE Copilot - Mutual Action Plan</title>
  <meta name="description" content="Joint 90-day path from discovery to signature. One owner per milestone, dates and blockers visible to both sides." />
  <link rel="canonical" href="/map.html" />
  <script>(function(){try{var t=localStorage.getItem("fec.theme");if(!t){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/elastic/glyph-cluster-color.svg" />
  <style>
    .map-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 14px; }
    @media (max-width: 980px) { .map-layout { grid-template-columns: 1fr; } }
    .map-panel { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; background: var(--panel); }
    .map-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
    .map-meta strong { color: var(--ink); }
    .map-pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .map-pill.draft { background: rgba(254, 197, 20, 0.18); color: #FEC514; }
    .map-pill.active { background: rgba(0, 191, 179, 0.18); color: #00BFB3; }
    .map-section-h { font-size: 12.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
    .map-ws { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel-2); }
    .map-ws-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
    .map-ws-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
    .map-grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .map-grid th, .map-grid td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    .map-grid th { font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .map-grid input, .map-grid select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; width: 100%; box-sizing: border-box; }
    .map-grid .status-not_started { color: var(--muted); }
    .map-grid .status-in_progress { color: #1BA9F5; }
    .map-grid .status-blocked { color: #F04E98; }
    .map-grid .status-done { color: #00BFB3; }
    .map-row-saved { animation: rowsaved 1.2s ease; }
    @keyframes rowsaved { 0% { background: rgba(0,191,179,0.18); } 100% { background: transparent; } }
    .map-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .map-empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; }
    .map-stakeholder { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .map-stakeholder:last-child { border-bottom: none; }
    .map-stakeholder .nm { font-weight: 700; color: var(--ink); font-size: 13px; }
    .map-stakeholder .rl { font-size: 11.5px; color: var(--muted); }
    .map-risk { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .map-risk:last-child { border-bottom: none; }
    .map-risk .ttl { font-weight: 700; color: var(--ink); }
    .sev-high { color: #F04E98; }
    .sev-medium { color: #FEC514; }
    .sev-low { color: #1BA9F5; }
  </style>
</head>
<body class="workspace-page">
  <a class="skip-to-main" href="#main-content">Skip to main content</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="FE Copilot home">
      <img class="logo-elastic" src="/assets/img/elastic/logo-horizontal-white.svg" alt="Elastic" width="64" height="22" />
      <span class="brand-sep">/</span>
      <span class="name">FE <span class="accent">Copilot</span></span>
      <span class="tag">Mutual Action Plan</span>
    </a>
    <div class="right">
      <a class="pill" href="/workspace.html">Workspace</a>
      <span class="pill" id="status" aria-live="polite">Loading...</span>
    </div>
  </header>

  <main class="container" id="main-content" tabindex="-1">
    <section class="hero">
      <h1>Mutual Action <span class="grad">Plan.</span></h1>
      <p class="lede">
        One joint 90-day path from discovery to signature. Every milestone has a date, an Elastic owner, a customer owner, and a blocker note if the date slips.
      </p>
    </section>

    <div id="map-root">
      <div class="map-empty">Loading...</div>
    </div>
  </main>

  <div id="toast-host" aria-live="polite"></div>

  <script src="/config.js?v=20260513"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/api-retry.js"></script>
  <script src="/assets/js/map.js?v=20260513"></script>
</body>
</html>
