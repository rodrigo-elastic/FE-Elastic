<!--
  filename: customers.html
  description: Legacy redirect. The Customers page was reframed as the FE
  Workspace at /workspace.html (FE Copilot is not a CRM; Salesforce is the
  system of record). This page redirects in three layers (HTTP-equiv meta
  refresh, JS replace, and a manual link fallback) so any bookmarked or
  cross-linked URL keeps working.
  Author: Rodrigo Careaga
  Date: 04-05-2026
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FE Copilot - Workspace</title>
  <meta name="description" content="Customers has been reframed as Workspace. Redirecting to /workspace.html..." />
  <link rel="canonical" href="/workspace.html" />
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=/workspace.html" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script>
    (function () {
      try {
        // Preserve query string and hash so deep links (eg. ?meeting=123) survive.
        var url = "/workspace.html" + (location.search || "") + (location.hash || "");
        location.replace(url);
      } catch (e) {
        // Hard fallback handled by the meta refresh + manual link below.
      }
    })();
  </script>
</head>
<body class="workspace-page" style="padding: 40px; font-family: Inter, system-ui, sans-serif; color: var(--ink, #1a1a1a);">
  <h1 style="margin: 0 0 8px 0">Workspace moved</h1>
  <p>Customers is now <a href="/workspace.html">/workspace.html</a>. Redirecting...</p>
</body>
</html>
