<!--
  filename: demo-data.html
  description: Legacy redirect. The standalone Demo Data page was merged into
  /industries.html ("Industries and Demo Data") so every scenario is exposed
  inline on its parent industry card. This page redirects in three layers
  (HTTP-equiv meta refresh, JS replace, and a manual link fallback) so any
  bookmarked or cross-linked URL keeps working. Mirrors the pattern used by
  customers.html.
  Author: Rodrigo Careaga
  Date: 13-05-2026
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FE Copilot - Industries and Demo Data</title>
  <meta name="description" content="Demo Data has been merged into Industries. Redirecting to /industries.html..." />
  <link rel="canonical" href="/industries.html" />
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=/industries.html#demo-data" />
  <script>(function(){try{var t=localStorage.getItem("fec.theme");if(!t){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script>
    (function () {
      try {
        // Preserve any scenario id stored in the hash (e.g. /demo-data.html#black-friday-outage)
        // by forwarding it to the combined page. Industries.js scrolls to the grid when it sees
        // the #demo-data marker; a deeper hash (#black-friday-outage) is left intact so future
        // versions of the page can scroll to the matching modal entry.
        var hash = location.hash || "";
        var fragment = hash && hash !== "#demo-data" ? hash : "#demo-data";
        var url = "/industries.html" + (location.search || "") + fragment;
        location.replace(url);
      } catch (e) {
        // Hard fallback handled by the meta refresh + manual link below.
      }
    })();
  </script>
</head>
<body class="industries-page" style="padding: 40px; font-family: Inter, system-ui, sans-serif; color: var(--ink, #1a1a1a);">
  <h1 style="margin: 0 0 8px 0">Demo Data moved</h1>
  <p>Demo Data is now part of <a href="/industries.html#demo-data">Industries and Demo Data</a>. Redirecting...</p>
</body>
</html>
