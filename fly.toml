# fly.toml - FE Copilot
#
# App:        fe-copilot (fallback: fe-copilot-rcareaga if the global name is taken)
# Region:     mia (Miami) - lowest RTT to the us-west-1 ES cluster of the demo
# Plan:       Fly free tier, shared-cpu-1x / 256 MB, auto-stop on idle
# Health:     GET /api/v1/health (FastAPI router from backend/app/api/routes_health.py)
#
# Secrets are NOT stored here. Set them with `fly secrets set` (see docs/deploy.md).

app            = "fe-copilot"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

# Non-secret runtime config. Anything sensitive (API keys, ES URL with token in
# query string, Kibana key) goes through `fly secrets set` instead.
[env]
  APP_ENV        = "production"
  LOG_LEVEL      = "INFO"
  MODEL_DEFAULT  = "claude-haiku-4-5"
  RUNTIME_DIR    = "/app/runtime"
  PYTHONPATH     = "backend"
  APP_HOST       = "0.0.0.0"
  APP_PORT       = "8123"

# Public HTTP service. Fly terminates TLS at the edge and forwards plain HTTP
# to internal_port; force_https = true issues a 301 for any :80 hit.
[http_service]
  internal_port       = 8123
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes           = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 20
    hard_limit = 40

# Edge-side healthcheck. Fly will mark the machine unhealthy and restart it if
# /api/v1/health stops returning 200 for `grace_period + interval * 3` seconds.
[[http_service.checks]]
  grace_period  = "20s"
  interval      = "30s"
  method        = "get"
  timeout       = "5s"
  path          = "/api/v1/health"
  protocol      = "http"

# VM sizing. 256 MB is the free-tier default; uvicorn + the FastAPI app sits at
# roughly 130 MB resident, leaving headroom for one weasyprint render at a time.
[[vm]]
  size        = "shared-cpu-1x"
  memory      = "256mb"
  cpu_kind    = "shared"
  cpus        = 1

# Persist /app/runtime so audit.jsonl, briefs/, troubleshoot/, workflow_state.json
# and any cached PDF artifacts survive a machine restart. 1 GB volume; resize
# with `fly volumes extend` if briefs/ grows beyond ~500 MB.
[[mounts]]
  source      = "fe_copilot_runtime"
  destination = "/app/runtime"
