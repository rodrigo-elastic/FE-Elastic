name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: backend
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend requirements
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: PYTHONPATH=backend python -m pytest backend/tests -q

  lint:
    name: Lint (ruff + syntax + dashes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Ruff check
        run: ruff check backend/

      - name: Python syntax check (compileall)
        run: python -m compileall -q backend

      - name: Forbid em-dash and en-dash
        run: |
          if grep -rn '[—–]' backend frontend docs \
              --include='*.py' \
              --include='*.html' \
              --include='*.js' \
              --include='*.css' \
              --include='*.md'; then
            echo "::error::Found em-dash or en-dash characters. Replace with ASCII '-' or rephrase."
            exit 1
          fi

