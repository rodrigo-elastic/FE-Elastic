[project]
name = "fe-copilot"
version = "0.1.0"
description = "FE Copilot: AI-powered assistant for Field Engineers (Elastic FY27 SKO Hackathon)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rodrigo Careaga" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.25.0",
    "elasticsearch>=8.13.0,<9",
    "weasyprint>=61.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
