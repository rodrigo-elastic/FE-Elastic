<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="1440" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8edf3"/>
    </linearGradient>
    <linearGradient id="hl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B64DD"/>
      <stop offset="100%" stop-color="#1BA9F5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFB3"/>
      <stop offset="100%" stop-color="#0B64DD"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="720" fill="url(#bg)"/>

  <!-- Elastic glyph (constellation) -->
  <g transform="translate(80, 80)" fill="#0B64DD">
    <circle cx="14" cy="14" r="6"/>
    <circle cx="46" cy="20" r="4"/>
    <circle cx="22" cy="40" r="4"/>
    <circle cx="50" cy="48" r="6"/>
    <circle cx="34" cy="62" r="4"/>
    <line x1="14" y1="14" x2="46" y2="20" stroke="#0B64DD" stroke-width="1.5" opacity="0.6"/>
    <line x1="14" y1="14" x2="22" y2="40" stroke="#0B64DD" stroke-width="1.5" opacity="0.6"/>
    <line x1="46" y1="20" x2="50" y2="48" stroke="#0B64DD" stroke-width="1.5" opacity="0.6"/>
    <line x1="22" y1="40" x2="50" y2="48" stroke="#0B64DD" stroke-width="1.5" opacity="0.6"/>
    <line x1="22" y1="40" x2="34" y2="62" stroke="#0B64DD" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="48" x2="34" y2="62" stroke="#0B64DD" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Logo title -->
  <text x="170" y="92" font-size="13" font-weight="700" letter-spacing="2.2" fill="#0B64DD">FIELD ENGINEER COPILOT</text>
  <text x="170" y="148" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.5">FE Copilot</text>

  <!-- Built on pill -->
  <rect x="1080" y="72" width="280" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1220" y="96" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Built on Anthropic Claude  +  Elastic 9.3</text>

  <!-- Main headline -->
  <text x="80" y="252" font-size="62" font-weight="900" fill="#0f172a" letter-spacing="-1.5">Field Engineers, finally</text>
  <rect x="76" y="286" width="860" height="78" rx="6" fill="url(#hl)"/>
  <text x="96" y="344" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="-1.5">go home on time.</text>

  <!-- Subtitle (3 lines) -->
  <text x="80" y="416" font-size="20" font-weight="700" fill="#0f172a">Seven agents.  Fourteen MCP tools.  28 demo scenarios.  33 competitor specialists.</text>
  <text x="80" y="446" font-size="19" font-weight="600" fill="#0B64DD">Build more tools and more agents from FE Copilot. Every one lands live in Kibana Agent Builder.</text>
  <text x="80" y="474" font-size="18" font-weight="500" fill="#475569">One closed loop from calendar invite to Salesforce write. Every meeting. Every account.</text>

  <!-- Stat cards row -->
  <g transform="translate(80, 520)">
    <!-- Card 1: 14+ MCP tools, extendable -->
    <rect x="0" y="0" width="400" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="24" y="24" width="4" height="82" rx="2" fill="url(#accent)"/>
    <text x="48" y="74" font-size="52" font-weight="900" fill="#0f172a">14+</text>
    <text x="170" y="64" font-size="13" font-weight="800" letter-spacing="1.5" fill="#0f172a">MCP TOOLS</text>
    <text x="170" y="92" font-size="12.5" fill="#475569">build more in NL, auto-upsert to Kibana</text>

    <!-- Card 2: 34+ Kibana agents -->
    <rect x="424" y="0" width="400" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="448" y="24" width="4" height="82" rx="2" fill="url(#accent)"/>
    <text x="472" y="74" font-size="52" font-weight="900" fill="#0f172a">34+</text>
    <text x="594" y="64" font-size="13" font-weight="800" letter-spacing="1.5" fill="#0f172a">KIBANA AGENTS</text>
    <text x="594" y="92" font-size="12.5" fill="#475569">master + 33 specialists, add your own</text>

    <!-- Card 3: 28 demo scenarios -->
    <rect x="848" y="0" width="432" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="872" y="24" width="4" height="82" rx="2" fill="url(#accent)"/>
    <text x="896" y="74" font-size="52" font-weight="900" fill="#0f172a">28</text>
    <text x="990" y="64" font-size="13" font-weight="800" letter-spacing="1.5" fill="#0f172a">DEMO SCENARIOS</text>
    <text x="990" y="92" font-size="12.5" fill="#475569">20 industries + 8 flagships, dual dashboards</text>
  </g>

  <!-- Repo URL -->
  <text x="720" y="694" font-size="13" font-weight="700" fill="#0B64DD" text-anchor="middle">github.com/rodrigo-elastic/FE-Elastic</text>
</svg>
